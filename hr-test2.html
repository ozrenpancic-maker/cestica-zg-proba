<!doctype html>
<html lang="hr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HR test v2</title>
<style>
:root{--bg:#fff;--fg:#1d1d1b;--mut:#666;--box:#f4f4f2}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161615;--fg:#eee;--mut:#aaa;--box:#24241f}}
body{background:var(--bg);color:var(--fg);font:16px/1.45 system-ui,sans-serif;margin:0;padding:16px;max-width:820px}
h1{font-size:1.2rem}button{font:inherit;padding:8px 14px;margin:6px 6px 6px 0}
pre{background:var(--box);padding:10px;white-space:pre-wrap;word-break:break-word;font-size:12px;max-height:70vh;overflow:auto}small{color:var(--mut)}
</style></head><body>
<h1>Čestica HR – test: zgrade i naziv k.o. iz DGU-a v2</h1>
<p><small>Za 6 točaka provjerava može li se iz DGU-ovog sloja zgrada (DKP_ZGRADE) dohvatiti sve zgrade u krugu oko točke jednim upitom (parametar buffer), koja polja imaju te zgrade i kako se dobije naziv katastarske općine. Šalje samo koordinate.</small></p>
<button id="go">Pokreni test</button><button id="cp">Kopiraj rezultat</button>
<pre id="out">—</pre>
<script>
function tm(lon,lat){const a=6378137,f=1/298.257222101,k0=0.9999,lon0=16.5,E0=500000,e2=f*(2-f),ep2=e2/(1-e2),r=Math.PI/180;
  const M=p=>{const e4=e2*e2,e6=e4*e2;return a*((1-e2/4-3*e4/64-5*e6/256)*p-(3*e2/8+3*e4/32+45*e6/1024)*Math.sin(2*p)+(15*e4/256+45*e6/1024)*Math.sin(4*p)-(35*e6/3072)*Math.sin(6*p));};
  const phi=lat*r,s=Math.sin(phi),c=Math.cos(phi),t=Math.tan(phi),N=a/Math.sqrt(1-e2*s*s),T=t*t,C=ep2*c*c,A=(lon-lon0)*r*c;
  return [E0+k0*N*(A+(1-T+C)*A**3/6+(5-18*T+T*T+72*C-58*ep2)*A**5/120), k0*(M(phi)+N*t*(A*A/2+(5-T+9*C+4*C*C)*A**4/24+(61-58*T+T*T+600*C-330*ep2)*A**6/720))];}
const out=document.getElementById("out"); let log=[]; const P=s=>{log.push(s); out.textContent=log.join("\n");}; const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const WMS="https://wms1-gs-oss.uredjenazemlja.hr/ows2-m/wms";
const PTS=[["Split, Firule",43.5120,16.4580],["Osijek, Tvrđa",45.5600,18.6940],["Pula, Veruda",44.8650,13.8420],["Zadar, Bokanjac",44.1330,15.2600],["Varaždin",46.3050,16.3370],["Dubrovnik, Lapad",42.6540,18.0850]];
async function gfi(layer,lat,lon,half,buffer,count){const [E,N]=tm(lon,lat); const W=101; const q=new URLSearchParams({SERVICE:"WMS",VERSION:"1.3.0",REQUEST:"GetFeatureInfo",FORMAT:"image/png",TRANSPARENT:"true",QUERY_LAYERS:layer,LAYERS:layer,STYLES:"",INFO_FORMAT:"application/json",I:"50",J:"50",CRS:"EPSG:3765",WIDTH:String(W),HEIGHT:String(W),BBOX:[E-half,N-half,E+half,N+half].map(x=>x.toFixed(2)).join(","),FEATURE_COUNT:String(count)});
  if(buffer) q.set("BUFFER",String(buffer));
  const t0=performance.now(), r=await fetch(WMS+"?"+q,{signal:AbortSignal.timeout(25000)}); const ms=Math.round(performance.now()-t0); if(!r.ok) throw new Error("HTTP "+r.status+" ("+ms+" ms)"); const j=await r.json(); j.__ms=ms; return j;}
document.getElementById("go").onclick=async()=>{log=[]; P("Početak "+new Date().toLocaleString("hr-HR")+"\n"+navigator.userAgent+"\n");
  for(const [n,lat,lon] of PTS){ P("== "+n+" ==");
    // 1) bez buffera: koliko zgrada vrati na točki
    for(const [lbl,half,buf] of [["točka (bez buffera)",1,0],["krug 80 m (buffer 40 px, 2 m/px)",80,40],["krug 80 m (buffer 80)",80,80]]){
      try{const j=await gfi("oss:DKP_ZGRADE",lat,lon,half,buf,300), F=j.features||[];
        const g0=F[0]&&F[0].geometry; const sif={}; for(const f of F){const s=(f.properties&&(f.properties.NACIN_UPORABE||f.properties.SIFRA_NACINA_UPORABE_ZGRADE||f.properties.VRSTA))||"?"; sif[s]=(sif[s]||0)+1;}
        P(`zgrade ${lbl}: ${F.length} · ${j.__ms} ms · geom ${g0?g0.type:"—"}`+(F.length?` · polja: ${Object.keys(F[0].properties||{}).join(", ")}`:"")+(F.length?` · vrste: ${JSON.stringify(sif).slice(0,200)}`:""));
        if(F.length&&lbl.indexOf("80 m (buffer 80)")>0){ let mn=1e9,mx=-1e9; for(const f of F){const c=f.geometry&&(f.geometry.type==="Polygon"?f.geometry.coordinates[0]:f.geometry.type==="MultiPolygon"?f.geometry.coordinates[0][0]:null); if(c){const [E,N]=tm(lon,lat); const d=Math.hypot(c[0][0]-E,c[0][1]-N); mn=Math.min(mn,d); mx=Math.max(mx,d);} } P(`   udaljenost prve točke zgrade od središta: od ${mn.toFixed(0)} do ${mx.toFixed(0)} m`);} 
      }catch(e){P(`✘ zgrade ${lbl}: ${e.name}: ${e.message}`);}
      await sleep(400); }
    // 2) naziv k.o.
    for(const layer of ["oss:DKP_KATASTARSKE_OPCINE","oss:SIF_KATASTARSKE_OPCINE"]){
      try{const j=await gfi(layer,lat,lon,1,0,1), f=j.features&&j.features[0]; P(`k.o. (${layer.slice(4)}): `+(f?JSON.stringify(Object.fromEntries(Object.entries(f.properties||{}).filter(([k,v])=>/NAZIV|MATICNI|IME|NAME|ID/i.test(k)))).slice(0,260):"nema"));}
      catch(e){P(`✘ ${layer}: ${e.name}: ${e.message}`);} await sleep(300); }
    P(""); }
  P("Kraj testa.");};
document.getElementById("cp").onclick=()=>{try{navigator.clipboard.writeText(out.textContent).then(()=>alert("Kopirano"))}catch(e){alert("Označi tekst ručno.")}};
</script></body></html>
