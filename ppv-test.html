<!doctype html>
<html lang="hr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PPV test v1</title>
<style>
:root{--bg:#fff;--fg:#1d1d1b;--mut:#666;--box:#f4f4f2}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161615;--fg:#eee;--mut:#aaa;--box:#24241f}}
body{background:var(--bg);color:var(--fg);font:16px/1.45 system-ui,sans-serif;margin:0;padding:16px;max-width:820px}
h1{font-size:1.2rem}button{font:inherit;padding:8px 14px;margin:6px 6px 6px 0}input{font:inherit;padding:6px;width:9em}
pre{background:var(--box);padding:10px;white-space:pre-wrap;word-break:break-word;font-size:12px;max-height:65vh;overflow:auto}small{color:var(--mut)}
</style></head><body>
<h1>Čestica HR – test: Plan približnih vrijednosti zemljišta (ISPU) v1</h1>
<p><small>Provjerava smije li aplikacija iz preglednika čitati sloj Plana približnih vrijednosti zemljišta preko ISPU-a i kako izgleda odgovor za točku. Šalje samo koordinate.</small></p>
<label>layerHash <input id="lh" value="xM5m5ElZUrM"></label> <label>serviceId <input id="sid" value="9" style="width:4em"></label> <label>sloj <input id="ly" value="404" style="width:5em"></label><br>
<button id="go">Pokreni test</button><button id="cp">Kopiraj rezultat</button>
<pre id="out">—</pre>
<script>
// HTRS96/TM (EPSG:3765) iz WGS84, ista formula kao u aplikaciji
function tm(lon,lat){const a=6378137,f=1/298.257222101,k0=0.9999,lon0=16.5,E0=500000,e2=f*(2-f),ep2=e2/(1-e2),r=Math.PI/180;
  const M=p=>{const e4=e2*e2,e6=e4*e2;return a*((1-e2/4-3*e4/64-5*e6/256)*p-(3*e2/8+3*e4/32+45*e6/1024)*Math.sin(2*p)+(15*e4/256+45*e6/1024)*Math.sin(4*p)-(35*e6/3072)*Math.sin(6*p));};
  const phi=lat*r,s=Math.sin(phi),c=Math.cos(phi),t=Math.tan(phi),N=a/Math.sqrt(1-e2*s*s),T=t*t,C=ep2*c*c,A=(lon-lon0)*r*c;
  return [E0+k0*N*(A+(1-T+C)*A**3/6+(5-18*T+T*T+72*C-58*ep2)*A**5/120), k0*(M(phi)+N*t*(A*A/2+(5-T+9*C+4*C*C)*A**4/24+(61-58*T+T*T+600*C-330*ep2)*A**6/720))];}
const out=document.getElementById("out"); let log=[]; const P=s=>{log.push(s); out.textContent=log.join("\n");};
const BASE="https://ispu.mgipu.hr/api/v1/gis/wms";
async function get(u){P("GET "+u.slice(0,170)+(u.length>170?"…":"")); try{const r=await fetch(u,{mode:"cors",credentials:"omit",signal:AbortSignal.timeout(20000)}); const t=await r.text(); P((r.ok?"✔ ":"✘ ")+"HTTP "+r.status+" · "+(r.headers.get("content-type")||"?")+" · "+t.length+" znakova"); return {ok:r.ok,t};}catch(e){P("✘ "+e.name+": "+e.message+" (najčešće CORS ili mreža)"); return null;}}
const PTS=[["Zagreb, Šestine",45.8590,15.9560],["Zagreb, Remete",45.8400,15.9900],["Zagreb, Trešnjevka",45.7990,15.9550],["Sesvete",45.8300,16.1100],["Krk, Kornić",45.0274,14.5935]];
document.getElementById("go").onclick=async()=>{log=[]; const lh=document.getElementById("lh").value.trim(), sid=document.getElementById("sid").value.trim(), ly=document.getElementById("ly").value.trim();
  P("Početak "+new Date().toLocaleString("hr-HR")+"\n"+navigator.userAgent);
  const qs=o=>new URLSearchParams({...o,layerHash:lh,serviceId:sid}).toString();
  P("\n== GetCapabilities ==");
  const c=await get(BASE+"?"+qs({SERVICE:"WMS",VERSION:"1.3.0",REQUEST:"GetCapabilities"}));
  if(c&&c.t){ const d=new DOMParser().parseFromString(c.t,"text/xml"); const L=[...d.getElementsByTagName("Layer")].map(x=>{const n=[...x.children].find(k=>k.localName==="Name"),t=[...x.children].find(k=>k.localName==="Title"); return n?n.textContent+" | "+(t?t.textContent:"")+" | queryable="+x.getAttribute("queryable"):null}).filter(Boolean);
    P("slojeva: "+L.length); L.slice(0,25).forEach(x=>P(" - "+x)); const fi=[...d.getElementsByTagName("GetFeatureInfo")][0]; if(fi) P("GFI formati: "+[...fi.getElementsByTagName("Format")].map(f=>f.textContent).join(", ")); if(!L.length) P("   "+c.t.slice(0,300)); }
  for(const [n,lat,lon] of PTS){ P("\n== "+n+" =="); const [E,N]=tm(lon,lat), d=5;
    for(const fmt of ["application/json","text/plain","text/html"]){
      const r=await get(BASE+"?"+qs({SERVICE:"WMS",VERSION:"1.3.0",REQUEST:"GetFeatureInfo",LAYERS:ly,QUERY_LAYERS:ly,STYLES:"",CRS:"EPSG:3765",BBOX:[E-d,N-d,E+d,N+d].map(v=>v.toFixed(2)).join(","),WIDTH:"101",HEIGHT:"101",I:"50",J:"50",INFO_FORMAT:fmt,FEATURE_COUNT:"3",FORMAT:"image/png"}));
      if(r&&r.t){ let s=r.t; try{const j=JSON.parse(s); s=JSON.stringify((j.features||[]).map(f=>f.properties||f.attributes||f)).slice(0,900);}catch(e){ s=s.replace(/<[^>]+>/g," ").replace(/\s+/g," ").slice(0,700);} P("   ["+fmt+"] "+s); if(r.ok&&s.length>40) break; } } }
  P("\nKraj testa.");};
document.getElementById("cp").onclick=()=>{try{navigator.clipboard.writeText(out.textContent).then(()=>alert("Kopirano"))}catch(e){alert("Označi tekst ručno.")}};
</script></body></html>
