<!doctype html>
<html lang="hr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Adrese test</title>
<style>
:root{--bg:#fff;--fg:#1d1d1b;--mut:#666;--box:#f4f4f2}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161615;--fg:#eee;--mut:#aaa;--box:#24241f}}
body{background:var(--bg);color:var(--fg);font:16px/1.45 system-ui,sans-serif;margin:0;padding:16px;max-width:820px}
h1{font-size:1.2rem}input{font:inherit;padding:6px;width:16em}button{font:inherit;padding:8px 14px;margin:6px 6px 6px 0}
pre{background:var(--box);padding:10px;white-space:pre-wrap;word-break:break-word;font-size:12px;max-height:65vh;overflow:auto}small{color:var(--mut)}
</style></head><body>
<h1>Čestica HR – test pretrage adrese (OpenStreetMap i registar adresa DGU)</h1>
<p><small>Provjerava što za upisanu adresu vraća OpenStreetMap (Nominatim) i može li aplikacija čitati službeni registar adresa DGU (WMS i WFS). Šalje samo adresu i točku.</small></p>
<label>Adresa <input id="q" value="Ledine 31 Kornić"></label> <label>Mjesto <input id="m" value="Kornić" style="width:8em"></label><br>
<button id="go">Pokreni test</button><button id="cp">Kopiraj rezultat</button>
<pre id="out">—</pre>
<script>
const out=document.getElementById("out"); let log=[]; const P=s=>{log.push(s); out.textContent=log.join("\n");};
async function get(u,t){P("GET "+u.slice(0,170)+(u.length>170?"…":"")); try{const r=await fetch(u,{signal:AbortSignal.timeout(20000)}); const x=await r.text(); P((r.ok?"✔ ":"✘ ")+"HTTP "+r.status+" · "+(r.headers.get("content-type")||"?")+" · "+x.length+" znakova"); return {ok:r.ok,t:x};}catch(e){P("✘ "+e.name+": "+e.message+" (CORS ili mreža)"); return null;}}
const lay=xml=>{const d=new DOMParser().parseFromString(xml,"text/xml"); return [...d.getElementsByTagName("*")].filter(e=>/^(Layer|FeatureType)$/.test(e.localName)).map(L=>{const n=[...L.children].find(c=>c.localName==="Name"),t=[...L.children].find(c=>c.localName==="Title"); return n?n.textContent+" | "+(t?t.textContent:"")+(L.getAttribute("queryable")?" | queryable="+L.getAttribute("queryable"):""):null}).filter(Boolean);};
document.getElementById("go").onclick=async()=>{log=[]; const q=document.getElementById("q").value.trim(), m=document.getElementById("m").value.trim();
  P("Početak "+new Date().toLocaleString("hr-HR")+"\n"+navigator.userAgent);
  P("\n== Nominatim (OpenStreetMap) ==");
  const n=await get("https://nominatim.openstreetmap.org/search?"+new URLSearchParams({q,format:"json",limit:"5",countrycodes:"hr",addressdetails:"1"}));
  let pt=null; if(n&&n.ok){try{const a=JSON.parse(n.t); a.forEach((x,i)=>P(` ${i+1}. ${x.display_name} | ${x.class}/${x.type} | ${(+x.lat).toFixed(6)}, ${(+x.lon).toFixed(6)} | kućni broj: ${x.address&&x.address.house_number||"—"}`)); if(a[0]) pt=[+a[0].lat,+a[0].lon];}catch(e){P(" "+n.t.slice(0,300));}}
  const s2=await get("https://nominatim.openstreetmap.org/search?"+new URLSearchParams({street:q.replace(new RegExp(m,"i"),"").trim(),city:m,format:"json",limit:"3",countrycodes:"hr",addressdetails:"1"}));
  if(s2&&s2.ok){try{JSON.parse(s2.t).forEach((x,i)=>P(` (strukturirano) ${i+1}. ${x.display_name} | ${x.class}/${x.type} | ${(+x.lat).toFixed(6)}, ${(+x.lon).toFixed(6)}`));}catch(e){}}
  P("\n== DGU registar adresa: WMS (anonimni) ==");
  const W="https://geoportal.dgu.hr/services/inspire/ad/wms";
  const c=await get(W+"?service=WMS&version=1.3.0&request=GetCapabilities");
  let L1=[]; if(c&&c.t){L1=lay(c.t); P("slojeva: "+L1.length); L1.slice(0,15).forEach(x=>P(" - "+x)); const d=new DOMParser().parseFromString(c.t,"text/xml"), fi=[...d.getElementsByTagName("*")].find(e=>e.localName==="GetFeatureInfo"); if(fi) P("GFI formati: "+[...fi.getElementsByTagName("*")].filter(e=>e.localName==="Format").map(f=>f.textContent).join(", "));}
  if(pt&&L1.length){ const ln=L1.find(x=>/address/i.test(x))||L1[0], name=ln.split(" | ")[0], dd=0.0004;
    for(const fmt of ["application/json","text/plain","text/html","application/vnd.ogc.gml"]){
      const r=await get(W+"?"+new URLSearchParams({SERVICE:"WMS",VERSION:"1.3.0",REQUEST:"GetFeatureInfo",LAYERS:name,QUERY_LAYERS:name,STYLES:"",CRS:"EPSG:4326",BBOX:[pt[0]-dd,pt[1]-dd,pt[0]+dd,pt[1]+dd].join(","),WIDTH:"101",HEIGHT:"101",I:"50",J:"50",INFO_FORMAT:fmt,FEATURE_COUNT:"10",FORMAT:"image/png"}));
      if(r&&r.t){P("   ["+fmt+"] "+r.t.replace(/<[^>]+>/g," ").replace(/\s+/g," ").slice(0,700)); if(r.ok&&r.t.length>200) break;} } }
  P("\n== DGU registar adresa: WFS ==");
  for(const u of ["https://geoportal.dgu.hr/services/inspire/ad/wfs","https://geoportal.dgu.hr/services/sla/inspire/wfs_ad/wfs"]){
    const w=await get(u+"?service=WFS&version=2.0.0&request=GetCapabilities"); if(w&&w.t){const L=lay(w.t); P("tipova: "+L.length); L.slice(0,10).forEach(x=>P(" - "+x)); if(!L.length) P("   "+w.t.replace(/\s+/g," ").slice(0,300));} }
  P("\nKraj testa.");};
document.getElementById("cp").onclick=()=>{try{navigator.clipboard.writeText(out.textContent).then(()=>alert("Kopirano"))}catch(e){alert("Označi tekst ručno.")}};
</script></body></html>
