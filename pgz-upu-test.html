<!doctype html><html lang="hr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PGŽ GIS: UPU i zone</title>
<style>body{font:14px/1.4 system-ui;margin:12px;max-width:900px}button{padding:8px 12px;margin:2px}pre{white-space:pre-wrap;background:#f4f4f4;padding:8px;border-radius:6px;max-height:60vh;overflow:auto}input{width:8em}</style></head><body>
<h1>PGŽ GIS: povezivanje UPU-a i zone</h1>
<p>Za točku pita županijske slojeve i ispisuje SVA polja (osobito oznaku zone i poveznice na glasilo). Pritisni „Pokreni”, pa „Kopiraj” i pošalji rezultat.</p>
<p>lat <input id="la" value="45.0187"> lon <input id="lo" value="14.6262"> <button id="go">Pokreni</button> <button id="cp">Kopiraj</button></p>
<p>Brzi odabir: <button data-p="45.0187,14.6262">Punat centar</button><button data-p="45.0220,14.6310">Kornić</button><button data-p="45.0275,14.5760">Krk</button></p>
<pre id="o">…</pre>
<script>
const PGZ="https://gisportal.pgz.hr/server/rest/services/STANJE/";
const L={namjena:PGZ+"NAMJENA_POVRSINA_NOVO/FeatureServer/0",planovi:PGZ+"IZRADA_PP/FeatureServer/0"};
const out=[];const log=s=>{out.push(s);document.getElementById("o").textContent=out.join("\n")};
async function q(url,lat,lon){const p=new URLSearchParams({geometry:lon+","+lat,geometryType:"esriGeometryPoint",inSR:"4326",spatialRel:"esriSpatialRelIntersects",outFields:"*",returnGeometry:"false",f:"json"});
 const r=await fetch(url+"/query?"+p);return r.json()}
async function meta(url){const r=await fetch(url+"?f=json");const j=await r.json();return (j.fields||[]).map(f=>f.name+":"+f.type).join(", ")}
document.getElementById("go").onclick=async()=>{out.length=0;const lat=+la.value,lon=+lo.value;log("točka "+lat+", "+lon+"  "+new Date().toISOString());
 for(const k of ["namjena","planovi"]){try{log("\n== "+k+" polja sloja: "+await meta(L[k]));const j=await q(L[k]+"",lat,lon);log("zapisa: "+(j.features||[]).length+(j.error?" GREŠKA "+JSON.stringify(j.error):""));
  for(const f of j.features||[])log(JSON.stringify(f.attributes,null,1))}catch(e){log(k+": GREŠKA "+e.message)}}};
document.getElementById("cp").onclick=()=>navigator.clipboard.writeText(document.getElementById("o").textContent);
document.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{const [a,c]=b.dataset.p.split(",");la.value=a;lo.value=c;go.onclick()});
</script></body></html>
