<!doctype html>
<html lang="hr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>OSS dijagnostika</title>
<style>
:root{--bg:#fff;--fg:#1d1d1b;--mut:#666;--box:#f4f4f2}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161615;--fg:#eee;--mut:#aaa;--box:#24241f}}
body{background:var(--bg);color:var(--fg);font:16px/1.45 system-ui,sans-serif;margin:0;padding:16px;max-width:820px}
h1{font-size:1.2rem}button{font:inherit;padding:8px 14px;margin:6px 6px 6px 0}select{font:inherit;padding:6px}
pre{background:var(--box);padding:10px;white-space:pre-wrap;word-break:break-word;font-size:12px;max-height:65vh;overflow:auto}small{color:var(--mut)}
</style></head><body>
<h1>Čestica HR – dijagnostika ZK uloška (OSS preko posrednika)</h1>
<p><small>Uzme 12 čestica oko odabrane točke iz katastarskog sloja DGU i za svaku pita posrednika (Worker) za ZK uložak, jednu po jednu, sa stankom od 1,5 s. Prikazuje samo stanje odgovora, broj čestice i broj uloška (bez vlasnika i tereta).</small></p>
<label>Područje <select id="pt"><option value="45.0274,14.5935">Krk, Kornić</option><option value="45.8400,15.9900">Zagreb, Remete</option><option value="45.7990,15.9550">Zagreb, Trešnjevka</option></select></label>
<button id="go">Pokreni</button><button id="cp">Kopiraj rezultat</button>
<pre id="out">—</pre>
<script>
const W="https://cestica-oss.ozren-pancic.workers.dev/", WMS="https://wms1-gs-oss.uredjenazemlja.hr/ows2-m/wms";
function tm(lon,lat){const a=6378137,f=1/298.257222101,k0=0.9999,lon0=16.5,E0=500000,e2=f*(2-f),ep2=e2/(1-e2),r=Math.PI/180;
  const M=p=>{const e4=e2*e2,e6=e4*e2;return a*((1-e2/4-3*e4/64-5*e6/256)*p-(3*e2/8+3*e4/32+45*e6/1024)*Math.sin(2*p)+(15*e4/256+45*e6/1024)*Math.sin(4*p)-(35*e6/3072)*Math.sin(6*p));};
  const phi=lat*r,s=Math.sin(phi),c=Math.cos(phi),t=Math.tan(phi),N=a/Math.sqrt(1-e2*s*s),T=t*t,C=ep2*c*c,A=(lon-lon0)*r*c;
  return [E0+k0*N*(A+(1-T+C)*A**3/6+(5-18*T+T*T+72*C-58*ep2)*A**5/120), k0*(M(phi)+N*t*(A*A/2+(5-T+9*C+4*C*C)*A**4/24+(61-58*T+T*T+600*C-330*ep2)*A**6/720))];}
const out=document.getElementById("out"); let log=[]; const P=s=>{log.push(s); out.textContent=log.join("\n");};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function idAt(lat,lon){const [E,N]=tm(lon,lat),d=1; const q=new URLSearchParams({SERVICE:"WMS",VERSION:"1.3.0",REQUEST:"GetFeatureInfo",FORMAT:"image/png",TRANSPARENT:"true",QUERY_LAYERS:"oss:BZP_CESTICE",LAYERS:"oss:BZP_CESTICE",STYLES:"",INFO_FORMAT:"application/json",I:"50",J:"50",CRS:"EPSG:3765",WIDTH:"101",HEIGHT:"101",BBOX:[E-d,N-d,E+d,N+d].map(x=>x.toFixed(2)).join(","),FEATURE_COUNT:"1"});
  const r=await fetch(WMS+"?"+q,{signal:AbortSignal.timeout(12000)}); const j=await r.json(); const p=j.features&&j.features[0]&&j.features[0].properties; return p?{id:String(p.CESTICA_ID),broj:p.BROJ_CESTICE}:null;}
document.getElementById("go").onclick=async()=>{log=[]; const [lat,lon]=document.getElementById("pt").value.split(",").map(Number);
  P("Početak "+new Date().toLocaleString("hr-HR")+"\n"+navigator.userAgent+"\n");
  const ids=new Map();
  for(let i=-2;i<=2&&ids.size<12;i++) for(let j=-2;j<=2&&ids.size<12;j++){ try{const c=await idAt(lat+i*0.00025,lon+j*0.00035); if(c&&!ids.has(c.id)) ids.set(c.id,c.broj);}catch(e){P("DGU sloj: "+e.message);} }
  P("Čestica za test: "+ids.size+"\n");
  let ok=0, bad=0, ul=0;
  for(const [id,broj] of ids){ const t0=performance.now();
    try{ const r=await fetch(W+"?id="+encodeURIComponent(id)+"&ulozak=1",{cache:"no-store",signal:AbortSignal.timeout(25000)}); const j=await r.json().catch(()=>null); const ms=Math.round(performance.now()-t0);
      if(r.ok&&j&&j.ok){ok++; const u=(j.ulosci||[]).map(x=>x.ulozak).join(","); if(u) ul++; P(`✔ ${broj} · HTTP ${r.status} · ${ms} ms · uložak ${u||"—"}${j.ulosciGreska?" · GREŠKA ULOŠKA: "+j.ulosciGreska:""}${j.izCachea?" · iz predmemorije":""} · cf ${j.cf||"?"}`);}
      else {bad++; P(`✘ ${broj} · HTTP ${r.status} · ${ms} ms · ${(j&&j.greska)||"?"} · cf ${(j&&j.cf)||"?"}`);} }
    catch(e){bad++; P(`✘ ${broj} · ${e.name}: ${e.message}`);}
    await sleep(1500); }
  P(`\nUkupno: ${ok} uspješno (od toga s uloškom ${ul}), ${bad} neuspješno.\nKraj testa.`);};
document.getElementById("cp").onclick=()=>{try{navigator.clipboard.writeText(out.textContent).then(()=>alert("Kopirano"))}catch(e){alert("Označi tekst ručno.")}};
</script></body></html>
